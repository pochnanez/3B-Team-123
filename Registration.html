<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="R_Style.css">
</head>

<body>

    <div class="registration-container">

        <div class="header">
            <img src="logo.png" alt="Sun Son Solar Logo" class="logo">
            <h1>Create an Account</h1>
            
        </div>

        <form action="#" method="POST">

            <div class="form-row">

                <div class="input-group">
                    <label for="firstname">First Name</label>
                    <input 
                        type="text" 
                        id="firstname" 
                        name="firstname"
                        placeholder="Enter first name"
                        required>
                </div>

                <div class="input-group">
                    <label for="middlename">Middle Name</label>
                    <input 
                        type="text" 
                        id="middlename" 
                        name="middlename"
                        placeholder="Enter middle name"
                        required>
                </div>

            </div>


            <div class="form-row">

                <div class="input-group">
                    <label for="lastname">Last Name</label>
                    <input 
                        type="text" 
                        id="lastname" 
                        name="lastname"
                        placeholder="Enter last name"
                        required>
                </div>

                <div class="input-group">
                    <label for="birthdate">Birthdate</label>
                    <input 
                        type="date" 
                        id="birthdate" 
                        name="birthdate"
                        required>
                </div>

            </div>


            <div class="input-group">
                <label>Gender</label>

                <div class="gender-options">

                    <label>
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Male"
                            required>
                        Male
                    </label>

                    <label>
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Female">
                        Female
                    </label>

                    <label>
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Prefer not to say">
                        Prefer not to say
                    </label>

                </div>
            </div>


            <div class="form-row">

                <div class="input-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="Enter email address"
                        required>
                </div>

                <div class="input-group">
                    <label for="contact">Contact Number</label>
                    <input 
                        type="tel" 
                        id="contact" 
                        name="contact"
                        placeholder="09XXXXXXXXX"
                        pattern="09[0-9]{9}"
                        title="Contact number must start with 09 and have 11 digits"
                        required>
                </div>

            </div>


            <div class="input-group">
                <label for="address">Address</label>
                <input 
                    type="text" 
                    id="address" 
                    name="address"
                    placeholder="Enter complete address"
                    required>
            </div>


            <div class="input-group">
                <label for="department">Department</label>
                <input 
                    type="text" 
                    id="department" 
                    name="department"
                    placeholder="Enter department (N/A if not applicable)">
                <p class="helper-text">Leave blank if not applicable.</p>
            </div>


            <div class="input-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username"
                    placeholder="Enter username"
                    required>
            </div>


            <div class="input-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Enter password"
                    minlength="8"
                    required>
            </div>


            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword"
                    placeholder="Confirm password"
                    minlength="8"
                    required>
                <p id="passwordMessage"></p>
            </div>


            <button type="submit" class="signup-btn">
                Sign Up
            </button>


            <p class="signin">
                Already have an account?
                <a href="#">Sign In</a>
            </p>

        </form>

    </div>

    <script src="R_Script.js"></script>

</body>
</html>
